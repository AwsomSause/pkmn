name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Content quality gate (QUALITY_GATES.md): fails when a content-report number gets worse than tools/content-baseline.json.
      - run: npm run report:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
